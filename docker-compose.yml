services:
  mstecnologias-db:
    image: postgres:17-alpine
    container_name: mstecnologias-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mstecnologias}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mstecnologias-db-data:/var/lib/postgresql/data
    networks:
      - mstecnologias-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${POSTGRES_DB:-mstecnologias}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mstecnologias-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mstecnologias-app
    restart: unless-stopped
    depends_on:
      mstecnologias-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_R2DBC_URL: r2dbc:postgresql://mstecnologias-db:5432/${POSTGRES_DB:-mstecnologias}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - mstecnologias-net

networks:
  mstecnologias-net:
    driver: bridge

volumes:
  mstecnologias-db-data:
    driver: local
