spring:
  application:
    name: mstecnologias
  config:
    import: optional:file:.env[.properties]
  main:
    web-application-type: reactive

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/mstecnologias}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true
    diskspace:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}

# Instancias de ejemplo: renombralas al integrar cada dependencia externa.
resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    configs:
      default:
        register-health-indicator: true
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 25s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        max-wait-duration: 10s
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 25
        max-wait-duration: 500ms
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
        cancel-running-future: true

logging:
  level:
    root: INFO
    com.pragma.jamarlesf.mstecnologias: DEBUG

appDescription: "Microservicio reactivo hexagonal de gestion de tecnologias para el reto 3"
appVersion: "1.0.0"
